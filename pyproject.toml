[project]
name = "munich-subway-ridership-forecast"
version = "0.1.0"
description = "7-day-ahead hourly ridership forecast per Munich subway station with LightGBM"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lightgbm==4.6.0",
    "matplotlib==3.11.0",
    "numpy==2.4.6",
    "pandas==2.3.3",
]

[dependency-groups]
dev = [
    "ipykernel==6.30.1",
    "jupytext==1.18.1",
    "pre-commit==4.6.0",
    "ruff==0.15.17",
    "vulture==2.14",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["."]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "RUF", # Ruff-specific
]
ignore = [
    "E501", # line length (handled by editor / optional formatter pass)
    "B008", # function-call default args — normal for FastAPI/Streamlit patterns
]
